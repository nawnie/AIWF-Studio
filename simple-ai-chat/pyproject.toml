[project]
name = "simple-ai-chat"
version = "0.0.1"
description = "Local multi-model Qwen chat harness with a VRAM-aware model scheduler"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=8.0"]

[project.scripts]
simple-ai-chat = "simple_ai_chat.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simple_ai_chat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
