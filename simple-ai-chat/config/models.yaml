# Simple AI Chat model registry.
#
# VRAM estimate per model = weights_gib + mmproj_gib (if mmproj_on_gpu)
#                         + ctx * kv_kib_per_token_f16 * kv_type factor + overhead_gib
# Sizes are from the Hugging Face file listings (GiB). "est." marks guesses that
# the ModelManager replaces with NVML measurements after the first load.
#
# residency: pinned | warm | transient | cpu      (see docs/ARCHITECTURE.md)
# rank: lower wins when several enabled models provide the same capability.
# Files live in models/<id>/<file>. launch keys become llama-server flags.
# "# verify filename" marks community-GGUF names not yet checked against the repo.

toggles:
  thinking: true
  reasoning_effort: medium      # Bonsai: only medium / xhigh are meaningful ("high" -> HTTP 500)
  preserve_thinking: true       # disabled automatically inside tool loops on Bonsai
  prompt_enhancer: true         # Qwen-Image-2.1 PE models before image gen/edit
  speak_replies: false          # TTS every brain reply
  moderation: false             # Qwen3Guard pass on input / fetched content
  mtp: true                     # only affects mainline Qwen3.8 / Qwen3.5 profiles
  dflash2: false                # third-party drafter for mainline Qwen3.8-27B
  cloud_fallback: false         # Qwen Cloud API (Qwen3.8-Max, Omni-Flash, LiveTranslate)

profiles:
  chat:     {thinking: true,  reasoning_effort: medium, temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0}
  code:     {thinking: true,  reasoning_effort: xhigh,  temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0}
  research: {thinking: true,  reasoning_effort: xhigh,  temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0}
  game:     {thinking: true,  reasoning_effort: medium, temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0.05, presence_penalty: 0.0}
  fast:     {thinking: false, temperature: 0.7, top_p: 0.80, top_k: 20, min_p: 0.0, presence_penalty: 1.5}

models:
  # ---------------------------------------------------------------- brain
  - id: bonsai2-27b
    name: Ternary Bonsai 2 27B (Qwen3.8-27B, PTQ1_0)
    backend: llama-prism
    capabilities: [chat, reasoning, code, vision, tools]
    residency: pinned
    priority: 100
    rank: 1
    repo: prism-ml/Ternary-Bonsai-2-27B-gguf
    files:
      model: Ternary-Bonsai-2-27B-PTQ1_0.gguf      # PTQ1_0 decodes faster on Ada; PQ2_0 (6.71 GiB) prefills faster
      mmproj: Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
    weights_gib: 5.54
    mmproj_gib: 0.59
    mmproj_on_gpu: true
    kv_kib_per_token_f16: 64      # 16 full-attention layers x 4 KV heads x 256 dim
    ctx: 32768
    kv_type: f16
    overhead_gib: 1.2             # compute buffers (248K vocab) + DeltaNet state, est.
    launch:
      n_gpu_layers: 99
      flash_attn: "on"
      parallel: 1
      cache_ram: 24576            # avoid re-prefill every turn (Bonsai KNOWN_ISSUES)
      n_predict: 16384            # thinking eats the output budget
      reasoning: auto             # lets clients send reasoning_effort "none"
      jinja: true
    license: Apache-2.0
    notes: Needs the PrismML llama.cpp fork. No speculative decoding for Bonsai 2 yet.

  - id: qwen38-27b-iq3-mtp
    name: Qwen3.8-27B UD-IQ3_XXS + MTP (mainline A/B profile)
    backend: llama
    capabilities: [chat, reasoning, code, vision, tools]
    residency: warm
    exclusive: true
    enabled: false
    priority: 95
    rank: 2
    repo: unsloth/Qwen3.8-27B-GGUF
    files:
      model: Qwen3.8-27B-UD-IQ3_XXS.gguf
      draft: mtp-Qwen3.8-27B-Q4_0.gguf             # from the repo's MTP/ folder
      mmproj: mmproj-F16.gguf
    weights_gib: 11.46            # 10.18 model + 1.28 MTP sidecar
    mmproj_gib: 0.86
    mmproj_on_gpu: false
    kv_kib_per_token_f16: 64
    ctx: 32768
    kv_type: q4_0
    overhead_gib: 1.2
    launch:
      n_gpu_layers: 99
      flash_attn: "on"
      parallel: 1                 # speculative decoding gains vanish with parallel > 1
      spec_type: draft-mtp
      spec_draft_n_max: 2
      spec_draft_model: "{draft}"
      jinja: true
    license: Apache-2.0
    notes: Exclusive. Verify --spec-* flag names against the pinned llama.cpp build.

  - id: qwen36-35b-a3b
    name: Qwen3.6-35B-A3B (MoE speed brain, experts on CPU)
